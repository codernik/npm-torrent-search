<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="//fonts.googleapis.com/css?family=Roboto:300,300italic,700,700italic">
    <link id="dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/dark.css">
    <link id="light" rel="preload" href="https://cdn.jsdelivr.net/npm/water.css@2/out/light.css">
    <style>
        body {
            font-family: 'Roboto';
        }
        
        .card {
            box-shadow: 0 2px 6px 0 #0000004f;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
        }
        
        input#search {
            width: 100%;
        }
        
        .flex {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }
        
        .right {
            text-align: right;
        }
        
        .button {
            border: 1px solid;
            padding: 5px 10px;
            display: inline-block;
            margin: 5px 0;
            border-radius: 2px;
        }
        
        .seeds {
            color: #4caf50;
        }
        
        .peers {
            color: #f44336;
        }
        
        .provider-badge {
            font-size: 0.75em;
            padding: 2px 7px;
            border-radius: 10px;
            border: 1px solid;
            opacity: 0.7;
        }
        input#search {
            width: 100%;
            height: 44px;
            padding: 0 40px 0 44px;   /* room for search icon left, clear btn right */
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 15px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input#search:focus {
            border-color: #888;
            box-shadow: 0 0 0 3px rgba(100,100,200,0.12);
        }
        .search-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .input-group {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-group .icon-search {
            position: absolute;
            left: 14px;
            opacity: 0.4;
            pointer-events: none;
        }
        .clear-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.4;
            font-size: 18px;
            line-height: 1;
            padding: 4px;
        }
        .clear-btn:hover { opacity: 0.8; }
        .theme-btn {
            height: 44px;
            padding: 0 16px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            white-space: nowrap;
        }
    </style>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>

<body>
    <div id="app">
        <search-engine></search-engine>
    </div>
    <script>
        const app = Vue.createApp({})
        app.component('search-engine', {
            data() {
                return {
                    query: '',
                    results: [],
                    loading: false,
                    error: null,
                    _debounceTimer: null,
                    _cancelToken: null  // 👈 add this
                }
            },
            template: `
            <div class="search-wrapper">
                <div class="input-group">
                    <span class="icon-search">&#128269;</span>
                    <input type="text" id="search" placeholder="Search torrents..." v-model="query">
                    <button class="clear-btn" @click="query = ''" v-if="query" aria-label="Clear">&#x2715;</button>
                </div>
                <button class="theme-btn" onclick="toggleCss()">
                    &#9790; Dark mode
                </button>
            </div>

            <div v-if="loading" style="text-align:center; padding:20px;">Searching...</div>
            <div v-if="error" style="color:red; padding:10px;">{{ error }}</div>
            <div v-if="!loading && results.length === 0 && query" style="padding:10px; opacity:0.6;">No results found.</div>

            <div class="card" v-for="(result, index) in results" :key="index">
                <h4 style="margin:0 0 8px 0">
                    <a :href="result.magnet || result.desc" target="_blank">{{ result.title }}</a>
                </h4>
                <div class="flex">
                    <span class="seeds">▲ {{ result.seeds ?? 'N/A' }} seeds</span>
                    <span class="provider-badge">{{ result.provider }}</span>
                    <span class="peers">▼ {{ result.peers ?? 'N/A' }} peers</span>
                </div>
                <div class="flex">
                    <span>🕒 {{ result.time }}</span>
                    <span>💾 {{ result.size }}</span>
                </div>
                <div class="right" style="margin-top:8px">
                    <a v-if="result.magnet" class="button" :href="result.magnet">🧲 Magnet</a>
                    <a v-else-if="result.desc" class="button" :href="result.desc" target="_blank">🔗 Details</a>
                    <span v-else style="opacity:0.5; font-size:0.85em">No link available</span>
                </div>
            </div>
            `,
            methods: {
                onTypeQuery() {
                    if (!this.query.trim()) {
                        this.results = [];
                        return;
                    }
                    
                    // Cancel previous in-flight request
                    if (this._cancelToken) {
                        this._cancelToken.cancel();
                    }
                    this._cancelToken = axios.CancelToken.source();
                    
                    this.loading = true;
                    this.error = null;
                    var self = this;
                    
                    axios.get('/search', {
                        params: { query: this.query },
                        cancelToken: this._cancelToken.token  // 👈 attach token
                    })
                    .then(function (response) {
                        self.results = response.data;
                    })
                    .catch(function (error) {
                        if (!axios.isCancel(error)) {  // 👈 ignore cancelled requests
                            self.error = 'Search failed. Please try again.';
                            self.results = [];
                        }
                    })
                    .finally(function () {
                        self.loading = false;
                    });
                }
            },
            watch: {
                query(newQuery) {
                    clearTimeout(this._debounceTimer);
                    this._debounceTimer = setTimeout(() => {
                        this.onTypeQuery();
                    }, 500);
                }
            }
        })
        app.mount('#app')
        
        function toggleCss() {
            const light = document.getElementById('light');
            if (light.getAttribute('rel') === 'preload') {
                light.setAttribute('rel', 'stylesheet');
            } else {
                light.setAttribute('rel', 'preload');
            }
        }
    </script>
</body>

</html>
